document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:1.02;letter-spacing:-.01em;text-wrap:balance}\np{margin:0;text-wrap:pretty}\n.byline{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:11.5px;color:var(--mute);font-weight:500}\n/* ── masthead ── */\n.top{background:var(--ink);color:#fff}\n.top a{color:#fff}\n.top a:hover{color:#7fb2ff}\n.strip{display:flex;align-items:center;justify-content:space-between;gap:16px;height:34px;border-bottom:1px solid #222836;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:#8d95a6}\n.strip .live{display:flex;align-items:center;gap:7px;color:#fff}\n.dot{width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 3px rgba(200,52,31,.25)}\n.mast{display:flex;align-items:center;gap:18px;padding:20px 0 18px}\n.mark{width:58px;height:58px;border-radius:12px;overflow:hidden;flex:none;box-shadow:0 6px 20px rgba(10,95,214,.35)}\n.mark img{width:100%;height:100%;object-fit:cover}\n.wordmark{display:flex;flex-direction:column;gap:3px;min-width:0}\n.wordmark b{font-family:'Bodoni Moda',serif;font-weight:800;font-size:40px;line-height:.9;letter-spacing:-.02em}\n.wordmark b i{font-style:italic;font-weight:700;color:#7fb2ff}\n.wordmark span{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.3em;font-size:10.5px;color:#8d95a6}\n.mast-r{margin-left:auto;display:flex;align-items:center;gap:10px}\n.btn{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600;padding:10px 16px;border:1px solid #333b4c;border-radius:2px;color:#fff}\n.btn.solid{background:var(--blue);border-color:var(--blue)}\n.btn.solid:hover{background:#0b6ef5;color:#fff}\n.btn:hover{color:#fff;border-color:#6b7893}\nnav{display:flex;gap:26px;overflow-x:auto;border-top:1px solid #222836;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.13em;font-size:13px;font-weight:600;scrollbar-width:none}\nnav::-webkit-scrollbar{display:none}\nnav a{padding:12px 0;white-space:nowrap;border-bottom:2px solid transparent}\nnav a.on{border-bottom-color:var(--blue);color:#fff}\n/* ── ticker ── */\n.ticker{background:var(--blue);color:#fff;overflow:hidden;white-space:nowrap}\n.ticker .row{display:inline-flex;gap:44px;padding:9px 0;animation:slide 48s linear infinite;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;font-weight:500}\n.ticker .row i{font-style:normal;opacity:.65;margin-right:6px}\n.ticker .row em{font-style:normal;font-weight:700}\n@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n/* ── lead ── */\n.lead{display:grid;grid-template-columns:1.62fr .95fr;gap:0;border-bottom:3px solid var(--ink);padding:34px 0 30px}\n.lead>*+*{border-left:1px solid var(--rule);padding-left:30px;margin-left:30px}\n.lead-art{position:relative;margin-bottom:18px}\n.lead-art .tag{position:absolute;top:0;left:0;background:var(--ember);color:#fff;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600;padding:6px 12px;z-index:2;pointer-events:none}\n.lead h1{font-size:clamp(34px,4.6vw,62px)}\n.lead .dek{margin-top:14px;font-size:18px;color:#3b3f49;max-width:60ch}\n.lead .byline{margin-top:14px}\n.stack{display:flex;flex-direction:column;gap:20px}\n.stack .item{display:grid;gap:7px;padding-bottom:20px;border-bottom:1px solid var(--rule)}\n.stack .item:last-child{border:0;padding-bottom:0}\n.stack h3{font-size:22px;line-height:1.1}\n.stack p{font-size:14.5px;color:#4b4f59}\n/* ── sections ── */\n.sec-head{display:flex;align-items:baseline;gap:16px;border-bottom:2px solid var(--ink);padding:44px 0 10px;margin-bottom:24px}\n.sec-head h2{font-size:26px;letter-spacing:-.005em}\n.sec-head .more{margin-left:auto;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600;color:var(--blue)}\n.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}\n.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}\n.card{display:grid;gap:9px;align-content:start}\n.card .art{position:relative}\n.card h3{font-size:19px;line-height:1.14}\n.card p{font-size:14px;color:#4b4f59}\n/* ── box office ── */\n.bo{background:var(--ink);color:#fff;margin-top:52px;padding:40px 0 44px}\n.bo .wrap{display:grid;grid-template-columns:1.35fr 1fr;gap:46px}\n.bo h2{color:#fff;font-size:30px}\n.bo-head{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid #2a3140;padding-bottom:10px;margin-bottom:6px}\n.bo-head .asof{margin-left:auto;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:#7d859a}\ntable{width:100%;border-collapse:collapse}\nth{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:600;color:#7d859a;text-align:right;padding:12px 0 8px;border-bottom:1px solid #2a3140}\nth:first-child,td:first-child{text-align:left}\ntd{padding:12px 0;border-bottom:1px solid #1e2431;font-size:15px;vertical-align:baseline}\ntd.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}\ntd .t{font-weight:600}\ntd .s{display:block;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:#7d859a;margin-top:2px}\n.up{color:#4ade80}.down{color:#f87171}\n.bo-note{display:grid;gap:14px;align-content:start}\n.bo-note .bignum{font-family:'Bodoni Moda',serif;font-weight:800;font-size:76px;line-height:.85;color:#fff}\n.bo-note p{color:#aeb5c4;font-size:15px}\n.bo-note .split{display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid #2a3140;padding-top:16px;margin-top:4px}\n.bo-note .split div b{display:block;font-family:'Bodoni Moda',serif;font-size:30px;font-weight:700}\n.bo-note .split div span{font-family:'Barlow Condensed',sans-serif;text-transform:up 3em;font-size:12px;font-weight:600;margin-bottom:12px}\n.f-grid ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}\n.f-bot{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;padding-top:18px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px}\n.f-logo{display:flex;align-items:center;gap:12px;margin-bottom:14px}\n.f-logo img{width:40px;height:40px;border-radius:8px}\n.f-logo b{font-family:'Bodoni Moda',serif;color:#fff;font-size:24px;font-weight:800;letter-spacing:-.02em}\n@media(max-width:1000px){\n.lead,.bo .wrap,.two,.op .wrap{grid-template-columns:1fr}\n.lead>*+*{border-left:0;border-top:1px solid var(--rule);padding-left:0;margin-left:0;padding-top:24px;margin-top:6px}\n.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}\n.rev,.cal,.f-grid{grid-template-columns:1fr}\n.grid3{grid-template-columns:1fr}\n.wordmark b{font-size:32px}\n.mast-r .btn:first-child{display:none}\n}\n@media(max-width:620px){.grid4{grid-template-columns:1fr}.bo-note .bignum{font-size:58px}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header class=\"top\">\n<div class=\"wrap\">\n<div class=\"strip\">\n<div class=\"live\"><span class=\"dot\"><\u002Fspan>Live · India box office, Thursday 17 September 2026<\u002Fdiv>\n<div>Mumbai 28° · Chennai 31° · Hyderabad 27°<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"mast\">\n<a class=\"mark\" href=\"#\"><img src=\"2b0587f4-9d73-46a6-b1a3-97ab2236c7b8\" alt=\"Lets Cinema\"><\u002Fa>\n<div class=\"wordmark\"><b>Lets <i>Cinema<\u002Fi><\u002Fb><span>The Indian Film Trade · Est. 2019<\u002Fspan><\u002Fdiv>\n<div class=\"mast-r\"><a class=\"btn\" href=\"#\">Newsletters<\u002Fa><a class=\"btn solid\" href=\"#\">Subscribe<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<nav>\n<a class=\"on\" href=\"#\">Today<\u002Fa><a href=\"#bo\">Box Office<\u002Fa><a href=\"#reviews\">Reviews<\u002Fa><a href=\"#\">Bollywood<\u002Fa><a href=\"#\">South<\u002Fa><a href=\"#\">Malayalam<\u002Fa><a href=\"#\">Streaming<\u002Fa><a href=\"#cal\">Release Calendar<\u002Fa><a href=\"#op\">Opinion<\u002Fa><a href=\"#\">Awards<\u002Fa><a href=\"#\">Business<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"ticker\"><div class=\"row\">\n<span><i>Hanuman Ansh<\u002Fi><em>₹200 cr +<\u002Fem><\u002Fspan><span><i>Mirzapur: The Movie<\u002Fi><em>₹13.50 cr · 2nd Sat<\u002Fem><\u002Fspan><span><i>Bethlehem Kudumba Unit<\u002Fi><em>₹300 cr · Mal. record<\u002Fem><\u002Fspan><span><i>Haiwaan<\u002Fi><em>₹75 L · Day 4<\u002Fem><\u002Fspan><span><i>Mandaadi<\u002Fi><em>+60% · ₹24 cr in 3 days<\u002Fem><\u002Fspan><span><i>Toxic<\u002Fi><em>Advance ₹2.09 cr<\u002Fem><\u002Fspan><span><i>Daayra<\u002Fi><em>Opens tomorrow<\u002Fem><\u002Fspan>\n<span><i>Hanuman Ansh<\u002Fi><em>₹200 cr +<\u002Fem><\u002Fspan><span><i>Mirzapur: The Movie<\u002Fi><em>₹13.50 cr · 2nd Sat<\u002Fem><\u002Fspan><span><i>Bethlehem Kudumba Unit<\u002Fi><em>₹300 cr · Mal. record<\u002Fem><\u002Fspan><span><i>Haiwaan<\u002Fi><em>₹75 L · Day 4<\u002Fem><\u002Fspan><span><i>Mandaadi<\u002Fi><em>+60% · ₹24 cr in 3 days<\u002Fem><\u002Fspan><span><i>Toxic<\u002Fi><em>Advance ₹2.09 cr<\u002Fem><\u002Fspan><span><i>Daayra<\u002Fi><em>Opens tomorrow<\u002Fem><\u002Fspan>\n<\u002Fdiv><\u002Fdiv>\n\n<main class=\"wrap\">\n<section class=\"lead\">\n<article>\n<div class=\"lead-art\"><span class=\"tag\">The Big Story<\u002Fspan><image-slot id=\"lead-hero\" shape=\"rect\" style=\"height:420px\" placeholder=\"Lead art — Hanuman Ansh key still or theatre crowd (16:9)\"><\u002Fimage-slot><\u002Fdiv>\n<span class=\"kick\">Box Office · Analysis<\u002Fspan>\n<h1>Six weeks in, ‘Hanuman Ansh’ is still growing — and rewriting what a long run looks like<\u002Fh1>\n<p class=\"dek\">The superhero sequel crossed ₹200 crore nett on its sixth Saturday, then held ₹8 crore on a Monday in week six. Exhibitors say the film has quietly become the strongest word-of-mouth asset the trade has seen since <em>Chhaava<\u002Fem> — and it is now dictating screen counts for everyone releasing behind it.<\u002Fp>\n<p class=\"byline\">By Rhea Mansukhani · Trade Desk · 9 min read<\u002Fp>\n<\u002Farticle>\n<div class=\"stack\">\n<div class=\"item\"><span class=\"kick ember\">Breaking<\u002Fspan><h3>‘Bethlehem Kudumba Unit’ hits ₹300 crore, dethrones ‘Lokah’ as Malayalam’s highest grosser<\u002Fh3><p>Nivin Pauly and Mamitha Baiju's family epic becomes the first Malayalam film to clear the mark on domestic-led business.<\u002Fp><p class=\"byline\">Kochi · 2 hrs ago<\u002Fp><\u002Fdiv>\n<div class=\"item\"><span class=\"kick\">Opening Weekend<\u002Fspan><h3>‘Daayra’ arrives Friday: Meghna Gulzar's courtroom drama is the month's critical wildcard<\u002Fh3><p>Kareena Kapoor Khan and Prithviraj Sukumaran headline. Advances are soft, but multiplex Mumbai is tracking at 41%.<\u002Fp><p class=\"byline\">Mumbai · 5 hrs ago<\u002Fp><\u002Fdiv>\n<div class=\"item\"><span class=\"kick\">Postmortem<\u002Fspan><h3>What went wrong with ‘Haiwaan’: a ₹3 crore opening, and a four-day collapse<\u002Fh3><p>Priyadarshan's thriller with Akshay Kumar and Saif Ali Khan fell to ₹75 lakh on day four. Distributors are already re-papering screens.<\u002Fp><p class=\"byline\">Trade Desk · Yesterday<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"sec-head\"><span class=\"kick\">Section<\u002Fspan><h2>Top of the Trade<\u002Fh2><a class=\"more\" href=\"#\">All news →<\u002Fa><\u002Fdiv>\n<div class=\"grid4\">\n<article class=\"card\"><div class=\"art\"><image-slot id=\"c1\" shape=\"rect\" style=\"height:200px\" placeholder=\"Ramayana — Ranbir Kapoor / Yash first look\"><\u002Fimage-slot><\u002Fdiv><span class=\"kick\">Production<\u002Fspan><h3>Nitesh Tiwari's two-part ‘Ramayana’ locks its Diwali marketing blitz<\u002Fh3><p>Ranbir Kapoor and Yash front the year's most-anticipated title; the studio is holding footage until October.<\u002Fp><p class=\"byline\">By Aditya Rao<\u002Fp><\u002Farticle>\n<article class=\"card\"><div class=\"art\"><image-slot id=\"c2\" shape=\"rect\" style=\"height:200px\" placeholder=\"Shah Rukh Khan on the KING set\"><\u002Fimage-slot><\u002Fdiv><span class=\"kick\">Exclusive<\u002Fspan><h3>‘King’ moves into its final Mumbai schedule as Red Chillies plans a 4,000-screen break<\u002Fh3><p>Shah Rukh Khan's action thriller remains the highest pre-release tracker of 2026.<\u002Fp><p class=\"byline\">By Nikhil Shirodkar<\u002Fp><\u002Farticle>\n<article class=\"card\"><div class=\"art\"><image-slot id=\"c3\" shape=\"rect\" style=\"height:200px\" placeholder=\"Nani — The Paradise poster art\"><\u002Fimage-slot><\u002Fdiv><span class=\"kick\">Telugu<\u002Fspan><h3>Nani's ‘The Paradise’ sets a 24 September pan-India release across five languages<\u002Fh3><p>Distributors in the Nizam belt have closed at a record non-Prabhas number for the star.<\u002Fp><p class=\"byline\">By Sravani Reddy<\u002Fp><\u002Farticle>\n<article class=\"card\"><div class=\"art\"><image-slot id=\"c4\" shape=\"rect\" style=\"height:200px\" placeholder=\"Deepika Padukone portrait\"><\u002Fimage-slot><\u002Fdiv><span class=\"kick\">Global<\u002Fspan><h3>Deepika Padukone's Walk of Fame star is a first for an Indian actress — and a marker for the industry<\u002Fh3><p>Named in the 2026 Motion Pictures class alongside Emily Blunt and Timothée Chalamet.<\u002Fp><p class=\"byline\">By Farah Qureshi<\u002Fp><\u002Farticle>\n<\u002Fdiv>\n<\u002Fmain>\n\n<section class=\"bo\" id=\"bo\">\n<div class=\"wrap\">\n<div>\n<div class=\"bo-head\"><h2>India Box Office<\u002Fh2><span class=\"asof\">Nett, ₹ crore · as of 17 Sep, 9:40 PM IST<\u002Fspan><\u002Fdiv>\n<table>\n<thead><tr><th>Film<\u002Fth><th>Day<\u002Fth><th>Yesterday<\u002Fth><th>India nett<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td><span class=\"t\">Hanuman Ansh<\u002Fspan><span class=\"s\">Hindi + Telugu · Week 6<\u002Fspan><\u002Ftd><td class=\"n\">39<\u002Ftd><td class=\"n up\">8.00<\u002Ftd><td class=\"n\">204.60<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"t\">Bethlehem Kudumba Unit<\u002Fspan><span class=\"s\">Malayalam · Week 2<\u002Fspan><\u002Ftd><td class=\"n\">12<\u002Ftd><td class=\"n up\">6.40<\u002Ftd><td class=\"n\">168.25<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"t\">Mirzapur: The Movie<\u002Fspan><span class=\"s\">Hindi · Week 2<\u002Fspan><\u002Ftd><td class=\"n\">13<\u002Ftd><td class=\"n down\">4.10<\u002Ftd><td class=\"n\">96.80<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"t\">Mandaadi<\u002Fspan><span class=\"s\">Tamil · Week 1<\u002Fspan><\u002Ftd><td class=\"n\">4<\u002Ftd><td class=\"n up\">5.75<\u002Ftd><td class=\"n\">24.00<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"t\">Toxic: A Fairy Tale for Grown-ups<\u002Fspan><span class=\"s\">Kannada · Week 1<\u002Fspan><\u002Ftd><td class=\"n\">7<\u002Ftd><td class=\"n down\">3.20<\u002Ftd><td class=\"n\">61.40<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"t\">Irumudi<\u002Fspan><span class=\"s\">Tamil · Week 2<\u002Fspan><\u002Ftd><td class=\"n\">12<\u002Ftd><td class=\"n down\">1.15<\u002Ftd><td class=\"n\">33.70<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"t\">Haiwaan<\u002Fspan><span class=\"s\">Hindi · Week 1<\u002Fspan><\u002Ftd><td class=\"n\">6<\u002Ftd><td class=\"n down\">0.55<\u002Ftd><td class=\"n\">7.85<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"t\">Awarapan 2<\u002Fspan><span class=\"s\">Hindi · Week 3<\u002Fspan><\u002Ftd><td class=\"n\">19<\u002Ftd><td class=\"n down\">0.14<\u002Ftd><td class=\"n\">18.60<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n<div class=\"bo-note\">\n<span class=\"kick pale\">The Number<\u002Fspan>\n<div class=\"bignum\">₹204.6 cr<\u002Fdiv>\n<p><strong style=\"color:#fff\">Hanuman Ansh<\u002Fstrong> has now posted six consecutive weekends of growth — a pattern the trade has not recorded on a Hindi-belt release since 2025. Week-six Monday came in at ₹8 crore, roughly what most wide releases now make on an opening day.<\u002Fp>\n<div class=\"split\">\n<div><b>+17%<\u002Fb><span>Week 6 vs Week 5<\u002Fspan><\u002Fdiv>\n<div><b>3,110<\u002Fb><span>Screens retained, India<\u002Fspan><\u002Fdiv>\n<div><b>44%<\u002Fb><span>Avg. occupancy, evening<\u002Fspan><\u002Fdiv>\n<div><b>₹412 cr<\u002Fb><span>Worldwide gross<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"byline\" style=\"color:#7d859a\">Source: Lets Cinema trade estimates, compiled from exhibitor returns. Figures are nett of GST unless marked gross.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<main class=\"wrap\">\n<div class=\"sec-head\" id=\"reviews\"><span class=\"kick\">Section<\u002Fspan><h2>Reviews<\u002Fh2><a class=\"more\" href=\"#\">All reviews →<\u002Fa><\u002Fdiv>\n<div class=\"rev\">\n<article><image-slot id=\"r1\" shape=\"rect\" style=\"height:170px\" placeholder=\"Mirzapur: The Movie still\"><\u002Fimage-slot><div class=\"stars\">★★★<i>★★<\u002Fi><\u002Fdiv><h3>Mirzapur: The Movie<\u002Fh3><p class=\"verdict\">Pankaj Tripathi is still magnificent, but three seasons of plot compressed into 148 minutes leaves the Purvanchal that made this world feel like a backdrop rather than a character.<\u002Fp><p class=\"byline\">By Sohini Das · Hindi · 148 min<\u002Fp><\u002Farticle>\n<article><image-slot id=\"r2\" shape=\"rect\" style=\"height:170px\" placeholder=\"Toxic still — Yash\"><\u002Fimage-slot><div class=\"stars\">★★★★<i>★<\u002Fi><\u002Fdiv><h3>Toxic: A Fairy Tale for Grown-ups<\u002Fh3><p class=\"verdict\">Geetu Mohandas shoots Bengaluru like a fever. Yash has never been this unguarded on camera, and the film's cruelty is earned rather than performed.<\u002Fp><p class=\"byline\">By Arun Menon · Kannada · 161 min<\u002Fp><\u002Farticle>\n<article><image-slot id=\"r3\" shape=\"rect\" style=\"height:170px\" placeholder=\"Last Man In Tower still — Manoj Bajpayee\"><\u002Fimage-slot><div class=\"stars\">★★★★<i>★<\u002Fi><\u002Fdiv><h3>Last Man In Tower<\u002Fh3><p class=\"verdict\">A Mumbai redevelopment drama that understands the city's real violence is paperwork. Manoj Bajpayee holds the centre without ever raising his voice.<\u002Fp><p class=\"byline\">By Sohini Das · Hindi · 132 min<\u002Fp><\u002Farticle>\n<\u002Fdiv>\n\n<div class=\"two\" style=\"margin-top:52px\">\n<div>\n<div class=\"sec-head\" style=\"padding-top:0\"><span class=\"kick\">Wire<\u002Fspan><h2>More from today<\u002Fh2><\u002Fdiv>\n<div class=\"list\">\n<a class=\"row\" href=\"#\"><span class=\"num\">01<\u002Fspan><div><h4>Alia Bhatt's ‘Don't Be Shy’ drops its first trailer — a coming-of-age swing away from the action slate<\u002Fh4><p>Dharma is positioning the film for a year-end run; the trailer leans on heartbreak over spectacle.<\u002Fp><p class=\"byline\">Mumbai · 40 min ago<\u002Fp><\u002Fdiv><\u002Fa>\n<a class=\"row\" href=\"#\"><span class=\"num\">02<\u002Fspan><div><h4>Shweta Tripathi defends Jitendra Kumar replacing Vikrant Massey in ‘Mirzapur: The Movie’<\u002Fh4><p>“What Jeetu has done with the part is not an imitation,” the actor said at a Mumbai press interaction.<\u002Fp><p class=\"byline\">Interviews · 2 hrs ago<\u002Fp><\u002Fdiv><\u002Fa>\n<a class=\"row\" href=\"#\"><span class=\"num\">03<\u002Fspan><div><h4>‘Drishyam: The Conclusion’ trailer lands ahead of a 2 October release for Ajay Devgn and Tabu<\u002Fh4><p>Abhishek Pathak closes the trilogy with Jaideep Ahlawat as the new adversary. Panorama is planning a Gandhi Jayanti-weekend saturation break.<\u002Fp><p class=\"byline\">Releases · 4 hrs ago<\u002Fp><\u002Fdiv><\u002Fa>\n<a class=\"row\" href=\"#\"><span class=\"num\">04<\u002Fspan><div><h4>Kareena Kapoor Khan on ‘Ajooni Kohli’: “Meghna does not let you act. She only lets you think.”<\u002Fh4><p>The making-of featurette for <em>Daayra<\u002Fem> puts Prithviraj Sukumaran's investigating officer at the centre of the film's structure.<\u002Fp><p class=\"byline\">Features · 6 hrs ago<\u002Fp><\u002Fdiv><\u002Fa>\n<a class=\"row\" href=\"#\"><span class=\"num\">05<\u002Fspan><div><h4>Bipasha Basu says muscular women were once “not acceptable” in Bollywood<\u002Fh4><p>The actor revisits a two-decade shift in how the Hindi industry casts physicality.<\u002Fp><p class=\"byline\">Interviews · 8 hrs ago<\u002Fp><\u002Fdiv><\u002Fa>\n<a class=\"row\" href=\"#\"><span class=\"num\">06<\u002Fspan><div><h4>Exhibition: single screens in Bihar and eastern UP report their best September footfall in four years<\u002Fh4><p><em>Mirzapur<\u002Fem> and <em>Hanuman Ansh<\u002Fem> together account for 71% of ticketed admissions in the belt this fortnight.<\u002Fp><p class=\"byline\">Business · Yesterday<\u002Fp><\u002Fdiv><\u002Fa>\n<a class=\"row\" href=\"#\"><span class=\"num\">07<\u002Fspan><div><h4>‘Sardar 2’ finds its streaming home as Tamil titles keep bypassing the eight-week window<\u002Fh4><p>Producers are now negotiating digital dates before theatrical, a reversal of the 2024 norm.<\u002Fp><p class=\"byline\">Streaming · Yesterday<\u002Fp><\u002Fdiv><\u002Fa>\n<a class=\"row\" href=\"#\"><span class=\"num\">08<\u002Fspan><div><h4>‘Border 2’ sets its Republic Day 2027 slot, with Sunny Deol and Varun Dhawan returning<\u002Fh4><p>T-Series has begun blocking IMAX screens 16 months out — the longest lead time on record for a Hindi release.<\u002Fp><p class=\"byline\">Releases · 2 days ago<\u002Fp><\u002Fdiv><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<aside class=\"rail\">\n<div class=\"box\">\n<span class=\"kick ember\">Newsletter<\u002Fspan><h3>The Call Sheet<\u002Fh3><p>Every weekday at 7 AM IST: overnight numbers, one deal, one film worth your evening. Read by 40,000 people in the trade.<\u002Fp>\n<input type=\"email\" placeholder=\"you@studio.com\" aria-label=\"Email address\"><button type=\"button\">Sign me up<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"trend\">\n<span class=\"kick\" style=\"display:block;margin-bottom:2px\">Most read<\u002Fspan>\n<a href=\"#\"><i>1<\u002Fi><span>The economics of a six-week hold: how ‘Hanuman Ansh’ beat its own marketing spend<\u002Fspan><\u002Fa>\n<a href=\"#\"><i>2<\u002Fi><span>Malayalam cinema's ₹300 crore ceiling just moved. Who pays for the next one?<\u002Fspan><\u002Fa>\n<a href=\"#\"><i>3<\u002Fi><span>Every confirmed Indian release, September to December 2026<\u002Fspan><\u002Fa>\n<a href=\"#\"><i>4<\u002Fi><span>‘Toxic’ review: Yash burns down his own stardom<\u002Fspan><\u002Fa>\n<a href=\"#\"><i>5<\u002Fi><span>Why four Hindi thrillers opened in nine days — and three of them died<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Faside>\n<\u002Fdiv>\n\n<div class=\"sec-head\" id=\"cal\"><span class=\"kick\">Calendar<\u002Fspan><h2>What's Releasing<\u002Fh2><a class=\"more\" href=\"#\">Full 2026 calendar →<\u002Fa><\u002Fdiv>\n<div class=\"cal\">\n<div class=\"r\"><span class=\"d\">18 Sep<span>Friday<\u002Fspan><\u002Fspan><span class=\"t\">Daayra<span>Meghna Gulzar · Kareena Kapoor Khan, Prithviraj Sukumaran<\u002Fspan><\u002Fspan><span class=\"lang\">Hindi<\u002Fspan><\u002Fdiv>\n<div class=\"r\"><span class=\"d\">18 Sep<span>Friday<\u002Fspan><\u002Fspan><span class=\"t\">Demonte Colony 3<span>Ajay R Gnanamuthu · horror<\u002Fspan><\u002Fspan><span class=\"lang\">Tamil<\u002Fspan><\u002Fdiv>\n<div class=\"r\"><span class=\"d\">24 Sep<span>Thursday<\u002Fspan><\u002Fspan><span class=\"t\">The Paradise<span>Srikanth Odela · Nani<\u002Fspan><\u002Fspan><span class=\"lang\">Telugu<\u002Fspan><\u002Fdiv>\n<div class=\"r\"><span class=\"d\">25 Sep<span>Friday<\u002Fspan><\u002Fspan><span class=\"t\">The Vvaan: Force of the Forrest<span>Pan-India fantasy actioner<\u002Fspan><\u002Fspan><span class=\"lang\">Hindi<\u002Fspan><\u002Fdiv>\n<div class=\"r\"><span class=\"d\">2 Oct<span>Thursday<\u002Fspan><\u002Fspan><span class=\"t\">Drishyam: The Conclusion<span>Abhishek Pathak · Ajay Devgn, Tabu, Jaideep Ahlawat<\u002Fspan><\u002Fspan><span class=\"lang\">Hindi<\u002Fspan><\u002Fdiv>\n<div class=\"r\"><span class=\"d\">2 Oct<span>Thursday<\u002Fspan><\u002Fspan><span class=\"t\">Ranabaali<span>Period action drama<\u002Fspan><\u002Fspan><span class=\"lang\">Telugu<\u002Fspan><\u002Fdiv>\n<div class=\"r\"><span class=\"d\">9 Oct<span>Friday<\u002Fspan><\u002Fspan><span class=\"t\">Genie<span>Fantasy comedy<\u002Fspan><\u002Fspan><span class=\"lang\">Tamil<\u002Fspan><\u002Fdiv>\n<div class=\"r\"><span class=\"d\">TBD<span>Diwali<\u002Fspan><\u002Fspan><span class=\"t\">Ramayana: Part One<span>Nitesh Tiwari · Ranbir Kapoor, Yash<\u002Fspan><\u002Fspan><span class=\"lang\">Pan-India<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fmain>\n\n<section class=\"op\" id=\"op\">\n<div class=\"wrap\">\n<article>\n<span class=\"kick\">Column · The Ledger<\u002Fspan>\n<h3>The trade keeps calling long runs “miracles.” They are marketing failures in reverse.<\u002Fh3>\n<p>Nobody plans for week six. That is the point. Every distribution model in the country is built to extract 62% of a film's business in ten days, which means a film that grows is a film whose own campaign mispriced it. <em>Hanuman Ansh<\u002Fem> is not an anomaly — it is evidence.<\u002Fp>\n<div class=\"who\"><image-slot id=\"op1\" shape=\"circle\" style=\"width:42px;height:42px\" placeholder=\"\"><\u002Fimage-slot><div><b>Vikram Sahni<\u002Fb><span>Editor-at-large<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Farticle>\n<article>\n<span class=\"kick\">Column · Down South<\u002Fspan>\n<h3>Malayalam cinema didn't get bigger. It got better at being small.<\u002Fh3>\n<p>The ₹300 crore film that just broke the record cost under ₹30 crore to make. There is no star fee inflation, no six-language dub strategy, no VFX vendor in three time zones. The rest of the country should be studying the budget sheet, not the poster.<\u002Fp>\n<div class=\"who\"><image-slot id=\"op2\" shape=\"circle\" style=\"width:42px;height:42px\" placeholder=\"\"><\u002Fimage-slot><div><b>Anjali Pillai<\u002Fb><span>Kochi bureau<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Farticle>\n<article>\n<span class=\"kick\">Column · Screen Count<\u002Fspan>\n<h3>Four thrillers, nine days, one survivor. The Hindi release calendar is eating itself.<\u002Fh3>\n<p>September's pile-up was not competitive scheduling; it was insurance. When every producer hedges against a bigger film by moving <em>closer<\u002Fem> to it, the market does not expand — it just splits the same 4,800 screens into thinner slices and blames the audience.<\u002Fp>\n<div class=\"who\"><image-slot id=\"op3\" shape=\"circle\" style=\"width:42px;height:42px\" placeholder=\"\"><\u002Fimage-slot><div><b>Rhea Mansukhani<\u002Fb><span>Trade desk<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<main class=\"wrap\">\n<div class=\"sec-head\"><span class=\"kick\">Streaming<\u002Fspan><h2>On the Platforms<\u002Fh2><a class=\"more\" href=\"#\">All streaming →<\u002Fa><\u002Fdiv>\n<div class=\"grid3\">\n<article class=\"card\"><div class=\"art\"><image-slot id=\"s1\" shape=\"rect\" style=\"height:190px\" placeholder=\"Toaster — Rajkummar Rao, Sanya Malhotra\"><\u002Fimage-slot><\u002Fdiv><span class=\"kick\">Netflix<\u002Fspan><h3>‘Toaster’ finds its audience in week two, two months after a quiet theatrical pass<\u002Fh3><p>Vivek Daschaudary's comedy is the platform's most-watched Indian original this quarter.<\u002Fp><\u002Farticle>\n<article class=\"card\"><div class=\"art\"><image-slot id=\"s2\" shape=\"rect\" style=\"height:190px\" placeholder=\"Peddi — Ram Charan\"><\u002Fimage-slot><\u002Fdiv><span class=\"kick\">Data<\u002Fspan><h3>Post-theatrical windows in Telugu have shrunk to 34 days on average<\u002Fh3><p>Ram Charan's <em>Peddi<\u002Fem> moved to streaming inside seven weeks. Exhibitors want a floor written into contracts.<\u002Fp><\u002Farticle>\n<article class=\"card\"><div class=\"art\"><image-slot id=\"s3\" shape=\"rect\" style=\"height:190px\" placeholder=\"Mardaani 3 — Rani Mukerji\"><\u002Fimage-slot><\u002Fdiv><span class=\"kick\">Development<\u002Fspan><h3>YRF puts ‘Mardaani 3’ into a December shoot with Rani Mukerji returning<\u002Fh3><p>Abhiraj Minawala directs. The studio is planning a theatrical-first release despite platform interest.<\u002Fp><\u002Farticle>\n<\u002Fdiv>\n<\u002Fmain>\n\n<footer>\n<div class=\"wrap\">\n<div class=\"f-grid\">\n<div>\n<div class=\"f-logo\"><img src=\"2b0587f4-9d73-46a6-b1a3-97ab2236c7b8\" alt=\"Lets Cinema\"><b>Lets Cinema<\u002Fb><\u002Fdiv>\n<p>Independent trade reporting on Indian cinema — box office, business, and the films themselves. Mumbai · Chennai · Hyderabad · Kochi.<\u002Fp>\n<\u002Fdiv>\n<div><h4>Sections<\u002Fh4><ul><li><a href=\"#bo\">Box Office<\u002Fa><\u002Fli><li><a href=\"#reviews\">Reviews<\u002Fa><\u002Fli><li><a href=\"#\">Bollywood<\u002Fa><\u002Fli><li><a href=\"#\">South<\u002Fa><\u002Fli><li><a href=\"#\">Streaming<\u002Fa><\u002Fli><li><a href=\"#op\">Opinion<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n<div><h4>Company<\u002Fh4><ul><li><a href=\"#\">About us<\u002Fa><\u002Fli><li><a href=\"#\">Editorial standards<\u002Fa><\u002Fli><li><a href=\"#\">How we estimate<\u002Fa><\u002Fli><li><a href=\"#\">Advertise<\u002Fa><\u002Fli><li><a href=\"#\">Careers<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n<div><h4>Follow<\u002Fh4><ul><li><a href=\"#\">Newsletter<\u002Fa><\u002Fli><li><a href=\"#\">Instagram<\u002Fa><\u002Fli><li><a href=\"#\">YouTube<\u002Fa><\u002Fli><li><a href=\"#\">X<\u002Fa><\u002Fli><li><a href=\"#\">WhatsApp channel<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-bot\"><span>© 2026 Lets Cinema Media Pvt. Ltd.<\u002Fspan><span>Privacy · Terms · Corrections<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n\n<\u002Fbody><\u002Fhtml>"
